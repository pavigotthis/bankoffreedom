<nav class="stage-nav" aria-label="Student stages"><h2>Your journey</h2><ol>{% for s in progress.stages %}<li class="{{ 'current' if n is defined and n==s.number else '' }}"><a href="{{ '/student/stages/' ~ s.number if user.role=='student' else '#shared-progress' }}" {% if not s.available %}aria-disabled="true"{% endif %}{% if n is defined and n==s.number %} aria-current="step"{% endif %}><span class="stage-number">{{ s.number }}</span><span>{{ s.name }}<small>{{ status_labels.get(s.status,s.status|title) if s.available else 'Locked' }}</small></span></a></li>{% endfor %}</ol></nav>
