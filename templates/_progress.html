<nav class="stage-nav" aria-label="Student stages"><h2>Your journey</h2><ol>{% for s in progress.stages %}<li class="{{ 'current' if n is defined and n==s.number else '' }}"><a href="{{ '/student/stages/' ~ s.number if user.role=='student' else '#shared-progress' }}" {% if not s.available %}aria-disabled="true"{% endif %}><span class="stage-number">{{ s.number }}</span><span>{{ s.name }}<small>{{ s.status if s.available else 'Locked' }}</small></span></a></li>{% endfor %}</ol></nav>
